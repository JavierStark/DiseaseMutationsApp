<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Something went wrong - gRNA Builder</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
        body { font-family: system-ui, sans-serif; background: #FFF9FD; color: #2A1A26; display: grid; place-items: center; min-height: 100vh; margin: 0; }
        main { max-width: 32rem; padding: 2rem; border: 1px solid #E7D3E2; border-left: 4px solid #B31237; border-radius: 8px; background: #fff; }
        h1 { margin-top: 0; font-size: 1.5rem; }
        a { color: #8E2E7E; }
        @media (prefers-color-scheme: dark) { body { background: #1A1218; color: #F3E8F0; } main { background: #241A22; border-color: #3F2E3B; } a { color: #E8BFE0; } }
    </style>
</head>
<body>
<main>
    <h1>Something went wrong</h1>
    <p>The server hit an unexpected error while handling your request. Your inputs are kept in this browser, so you can go back and try again.</p>
    <p><a href="/">Return to the gRNA Builder</a></p>
</main>
</body>
</html>
