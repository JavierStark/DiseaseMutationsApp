# This MUST be at the top, otherwise Nginx will load defaults.
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {}

http {
    include       /etc/nginx/mime.types;

    # Explicitly add Blazor WebAssembly MIME types
    types {
        application/wasm wasm;
        application/octet-stream dll;
        application/octet-stream dat;
        application/json json;
    }

    sendfile        on;
    keepalive_timeout  65;

    # Disable loading of default configs
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Correct WASM and related files delivery
        # Disable gzip for WASM files to prevent corruption
        location ~* \.(wasm|dll|dat)$ {
            types {
                application/wasm wasm;
                application/octet-stream dll;
                application/octet-stream dat;
            }
            add_header Cache-Control "no-cache, no-transform";
            gzip off;
        }

        # Ensure JSON files are served correctly
        location ~* \.json$ {
            types {
                application/json json;
            }
            add_header Cache-Control "no-cache";
        }
    }
}
