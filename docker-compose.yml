version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: disease-mutations-app:latest
    container_name: disease-mutations-app
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 1G

volumes:
  bowtie-data:
    driver: local
