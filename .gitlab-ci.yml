# GitLab CI: checks (pin gate + tests) and the static example site on GitLab Pages. It deliberately builds no images: iGEM's
# shared runners have no privileged Docker, so image builds stay local (./start.sh). Every job image is pinned by digest
# (scripts/check-pins.sh).

stages: [lint, test, deploy]

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget"

# Pinning gate: no :latest inputs, no floating versions, no unpinned pip installs, lock files present.
pins:
  stage: lint
  image: alpine:3.20.3@sha256:1e42bbe2508154c9126d48c2b8a75420c3544343bf86fd041fb7527e017a4b4a
  before_script: [apk add --no-cache bash grep]
  script: [bash scripts/check-pins.sh]

# Pure tests: no container, no native dependencies. Integration tests needing ViennaRNA skip themselves. The browser tests
# (DiseaseMutationsApp.E2E) are part of the solution but skip themselves when Chromium is not installed, which is the case
# on these runners; run them locally (see README "Testing").
test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0.306-bookworm-slim@sha256:81f6d622fe21ed9d31375167f62a3538ff4d6835f9d5e6da9c2defa8a84b7687
  cache:
    key:
      files: [gRNA/packages.lock.json, DiseaseMutationsApp/packages.lock.json] # GitLab allows at most 2 files here
    paths: [.nuget/]
  script:
    - dotnet restore --locked-mode
    - dotnet build --no-restore -c Release
    - dotnet test DiseaseMutationsAppTests --no-build -c Release --collect:"XPlat Code Coverage" --logger "junit;LogFilePath=$CI_PROJECT_DIR/test-results-{assembly}.xml" -- NUnit.TestOutputXml=TestResults
    # coverlet writes Cobertura XML, not a console table: print the line rate in the form the coverage regex below reads.
    - |
      f=$(find DiseaseMutationsAppTests -name coverage.cobertura.xml -print -quit)
      rate=$(sed -n 's/.*<coverage [^>]*line-rate="\([0-9.]*\)".*/\1/p' "$f" | sed -n 1p)
      awk -v r="$rate" 'BEGIN { printf "Total | %.1f%%\n", r * 100 }'
  coverage: '/Total\s*\|\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: test-results-*.xml
      coverage_report:
        coverage_format: cobertura
        path: DiseaseMutationsAppTests/TestResults/**/coverage.cobertura.xml

# GitLab Pages: the static example results in gallery/data, arranged by scripts/build-gallery.py (Python standard library only,
# no Diana code runs here). Only the default branch deploys. Pages must be switched on for the project (Deploy > Pages) first.
pages:
  stage: deploy
  image: alpine:3.20.3@sha256:1e42bbe2508154c9126d48c2b8a75420c3544343bf86fd041fb7527e017a4b4a
  before_script: [apk add --no-cache python3]
  script: [python3 -I scripts/build-gallery.py --out public]
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
